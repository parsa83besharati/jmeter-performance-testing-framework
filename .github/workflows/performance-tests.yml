name: Framework Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-framework:
    name: Validate Framework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JMX XML Syntax
        run: |
          echo "=== Validating JMX XML Files ==="
          ERRORS=0
          for f in jmeter/test-plans/*.jmx jmeter/fragments/*.jmx; do
            if python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')" 2>/dev/null; then
              echo "  [PASS] $f"
            else
              echo "  [FAIL] $f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "ERROR: $ERRORS JMX files have invalid XML"
            exit 1
          fi

      - name: Validate Test Plan Structure
        run: |
          echo "=== Validating Test Plan Structure ==="
          ERRORS=0
          for f in jmeter/test-plans/*.jmx; do
            NAME=$(basename "$f")
            if grep -q 'testclass="TestPlan"' "$f"; then
              echo "  [PASS] $NAME has TestPlan element"
            else
              echo "  [FAIL] $NAME missing TestPlan element"
              ERRORS=$((ERRORS + 1))
            fi
            if grep -q 'IncludeController' "$f"; then
              echo "  [PASS] $NAME uses IncludeController (modular)"
            else
              echo "  [WARN] $NAME does not use IncludeController"
            fi
            if grep -q 'ResultCollector' "$f"; then
              echo "  [PASS] $NAME has ResultCollector"
            else
              echo "  [FAIL] $NAME missing ResultCollector"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: Validate Python Scripts Syntax
        run: |
          echo "=== Validating Python Scripts ==="
          for f in scripts/*.py; do
            if python3 -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>/dev/null; then
              echo "  [PASS] $f"
            else
              echo "  [FAIL] $f"
              exit 1
            fi
          done

      - name: Validate Shell Scripts
        run: |
          echo "=== Validating Shell Scripts ==="
          for f in scripts/*.sh; do
            chmod +x "$f"
            if bash -n "$f" 2>/dev/null; then
              echo "  [PASS] $f"
            else
              echo "  [FAIL] $f"
              exit 1
            fi
          done

      - name: Validate Configuration
        run: |
          echo "=== Validating Configuration ==="
          for PROP in BASE_URL API_KEY LOAD_USERS P95_THRESHOLD P99_THRESHOLD ERROR_RATE_THRESHOLD; do
            if grep -q "^${PROP}=" jmeter/config/test-config.properties; then
              echo "  [PASS] Property $PROP defined"
            else
              echo "  [FAIL] Property $PROP missing"
              exit 1
            fi
          done
          # Validate SLA config JSON
          if python3 -c "import json; json.load(open('jmeter/config/sla-config.json'))" 2>/dev/null; then
            echo "  [PASS] sla-config.json is valid JSON"
          else
            echo "  [FAIL] sla-config.json is invalid"
            exit 1
          fi

      - name: Validate Project Structure
        run: |
          echo "=== Validating Project Structure ==="
          REQUIRED_DIRS=("jmeter/config" "jmeter/data" "jmeter/fragments" "jmeter/test-plans" "scripts")
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "  [PASS] $dir"
            else
              echo "  [FAIL] $dir missing"
              exit 1
            fi
          done
          REQUIRED_FILES=("LICENSE" "README.md" "CONTRIBUTING.md" "Dockerfile" "docker-compose.yml" ".editorconfig")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "  [PASS] $file"
            else
              echo "  [FAIL] $file missing"
              exit 1
            fi
          done

      - name: Test SLA Validator
        run: |
          echo "=== Testing SLA Validator ==="
          # Create a mock JTL file
          cat > /tmp/mock-results.jtl << 'EOF'
          timeStamp,elapsed,label,responseCode,responseMessage,threadName,DataType,success,failureMessage,bytes,sentBytes,grpThreads,allThreads,URL,Latency,Connect
          1000,150,GET List Users,200,OK,Thread 1-1,text,true,,1024,256,1,1,https://reqres.in/api/users?page=1,120,30
          1000,200,GET Single User,200,OK,Thread 1-1,text,true,,512,128,1,1,https://reqres.in/api/users/1,180,20
          1000,300,POST Create User,201,Created,Thread 1-1,text,true,,256,512,1,1,https://reqres.in/api/users,250,40
          1000,180,PUT Update User,200,OK,Thread 1-1,text,true,,256,512,1,1,https://reqres.in/api/users/1,150,30
          1000,100,DELETE User,204,No Content,Thread 1-1,text,true,,0,0,1,1,https://reqres.in/api/users/1,80,20
          EOF
          
          if python3 scripts/validate-sla.py /tmp/mock-results.jtl --test-type smoke; then
            echo "  [PASS] SLA validator works correctly"
          else
            echo "  [FAIL] SLA validator failed"
            exit 1
          fi

      - name: Test HTML Report Generator
        run: |
          echo "=== Testing HTML Report Generator ==="
          python3 scripts/generate-html-report.py /tmp/mock-results.jtl --output /tmp/test-report.html --title "CI Test Report"
          if [ -f /tmp/test-report.html ] && grep -q "CI Test Report" /tmp/test-report.html; then
            echo "  [PASS] HTML report generated successfully"
          else
            echo "  [FAIL] HTML report generation failed"
            exit 1
          fi

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "  Framework Validation Complete"
          echo "========================================"
          echo ""
          echo "  JMX Files:     $(find jmeter -name '*.jmx' | wc -l)"
          echo "  Test Plans:    $(find jmeter/test-plans -name '*.jmx' | wc -l)"
          echo "  Fragments:     $(find jmeter/fragments -name '*.jmx' | wc -l)"
          echo "  Python Scripts: $(find scripts -name '*.py' | wc -l)"
          echo "  Shell Scripts:  $(find scripts -name '*.sh' | wc -l)"
          echo "  Config Files:  $(find jmeter/config -name '*.properties' -o -name '*.json' | wc -l)"
          echo ""
          echo "  All checks passed!"
